name: Build and Scan Vulnerable Image

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image (Local Runner)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: vulnerable-test-image:latest
          load: true

      - name: Run Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vulnerable-test-image:latest'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: Save Docker Image to File
        run: docker save vulnerable-test-image:latest -o vulnerable-image.tar

      - name: Upload Image as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulnerable-docker-image
          path: vulnerable-image.tar
